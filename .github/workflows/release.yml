name: Release CookieGuard

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Package and Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build ZIP package
        shell: bash
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          ZIP_NAME="CookieGuard-${TAG_NAME}.zip"
          echo "Empaquetando $ZIP_NAME..."
          python tools/empaquetar.py --output "$ZIP_NAME"
          sha256sum "$ZIP_NAME" > "${ZIP_NAME}.sha256"
          cat "${ZIP_NAME}.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            CookieGuard-*.zip
            CookieGuard-*.zip.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
