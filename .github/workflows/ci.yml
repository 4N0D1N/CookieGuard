name: CI CookieGuard

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ '3.10', '3.11', '3.12' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify zero mandatory dependencies
        shell: bash
        run: |
          echo "Verificando que no haya dependencias externas obligatorias..."
          python -c "import sqlite3, json, hashlib, base64, dataclasses; print('Core stdlib OK')"

      - name: Install optional forensic encryption dependency
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -r requirements-forensics.txt

      - name: Install optional desktop webview dependency
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pywebview

      - name: Run unit test suite
        shell: bash
        run: |
          python -m unittest discover -s tests

      - name: Run security and privacy validation tests
        shell: bash
        run: |
          python -m unittest discover -s tests -p "test_seguridad.py"

      - name: Install Pillow for Windows GUI snapshot
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pillow

      - name: Visual GUI check on Windows (Anti-Classic Tkinter check)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python tools/verificar_gui_windows.py

      - name: Upload Windows GUI visual verification screenshot
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-gui-screenshot-py${{ matrix.python-version }}
          path: artifacts/cookieguard_windows_gui.png
          if-no-files-found: ignore

  validate-stix:
    name: Validate STIX 2.1 export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install STIX validator
        run: python -m pip install --disable-pip-version-check stix2-validator
      - name: Validate exported bundle against STIX 2.1
        run: python tools/validar_stix.py
