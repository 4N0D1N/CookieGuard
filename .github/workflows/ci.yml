name: CI CookieGuard

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ '3.10', '3.11', '3.12' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify zero mandatory dependencies
        shell: bash
        run: |
          echo "Verificando que no haya dependencias externas obligatorias..."
          python -c "import sqlite3, json, hashlib, base64, dataclasses; print('Core stdlib OK')"

      - name: Run unit test suite
        shell: bash
        run: |
          python -m unittest discover -s tests

      - name: Run security and privacy validation tests
        shell: bash
        run: |
          python -m unittest discover -s tests -p "test_seguridad.py"
